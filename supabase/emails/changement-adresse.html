<!-- Supabase → Authentication → Emails → « Change Email Address »
     Objet (Subject) : ✉️ Confirme ta nouvelle adresse Kultivo
     Coller tout ce qui suit dans « Message body ». -->
<div style="margin:0;padding:24px 12px;background:#eef3f8;font-family:Arial,Helvetica,sans-serif;color:#1b2745">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;padding:28px 24px;text-align:center">
    <img src="https://aymericchevailler45-pixel.github.io/Kultivo/icons/icon-192.png" width="72" height="72" alt="Kultivo" style="border-radius:18px">
    <h1 style="margin:16px 0 8px;font-size:22px">Nouvelle adresse e-mail</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#5d6987">
      Tu veux utiliser <b style="color:#1b2745">{{ .NewEmail }}</b> pour ton compte Kultivo.
      Touche le bouton pour confirmer.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;border-radius:999px;background:#3d8bff;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none">
      Confirmer ma nouvelle adresse
    </a>
    <p style="margin:22px 0 0;font-size:13px;line-height:1.5;color:#8a95ad">
      Ce n'est pas toi&nbsp;? Ignore cet e-mail&nbsp;: ton adresse ne change pas.
    </p>
  </div>
  <p style="max-width:480px;margin:14px auto 0;text-align:center;font-size:12px;color:#8a95ad">
    Kultivo · cultive ta curiosité ·
    <a href="https://aymericchevailler45-pixel.github.io/Kultivo/confidentialite.html" style="color:#8a95ad">Confidentialité</a>
  </p>
</div>
